name = "ilm-yun"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Optional: 20 requests per minute per IP. Remove this block if your
# Cloudflare plan doesn't offer rate limiting.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secrets (set with `npx wrangler secret put <NAME>`):
#   ANTHROPIC_API_KEY  your Claude API key
#   APP_KEY            any long random string; the app sends it as X-App-Key
# Optional plain variable:
# [vars]
# MODEL = "claude-opus-5-5"
