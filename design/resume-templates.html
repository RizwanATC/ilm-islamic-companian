<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Templates</title>
<style>
  :root { --bg:#eceef3; --ink:#12151c; --muted:#5d6676; }
  * { box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .bar { position:sticky; top:0; z-index:5; display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:10px 16px; background:#12151c; color:#fff; }
  .bar b { margin-right:8px; }
  .bar button { border:0; border-radius:99px; padding:7px 16px; font:inherit; cursor:pointer; background:#2a303b; color:#fff; }
  .bar button.on { background:#8b7cff; font-weight:600; }
  .bar .print { margin-left:auto; background:#fff; color:#12151c; }
  .stage { padding:24px 12px 60px; display:flex; justify-content:center; overflow-x:auto; }
  .page { width:210mm; min-height:297mm; background:#fff; box-shadow:0 10px 40px rgba(18,21,28,.2); flex:none; display:none; overflow:hidden; }
  .page.show { display:block; }
  .page h1,.page h2,.page h3,.page p,.page ul { margin:0; }
  .page ul { padding-left:16px; }
  .page li { margin:2.5px 0; }
  .row { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
  .tag { display:inline-block; padding:1px 9px; margin:2px 3px 0 0; border-radius:99px; font-size:11px; }

  /* A: Aurora */
  #a.show { display:block; }
  #a .hero { padding:14mm 14mm 11mm; color:#fff; background:linear-gradient(120deg,#4f46e5 0%,#8b5cf6 55%,#ec4899 100%); }
  #a .hero h1 { font-size:32px; font-weight:800; letter-spacing:-.02em; }
  #a .hero .role { font-size:15px; opacity:.92; margin-top:2px; }
  #a .hero .contact { display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:10px; font-size:11.5px; opacity:.9; }
  #a .body { display:grid; grid-template-columns:1fr 62mm; gap:10mm; padding:9mm 14mm 14mm; }
  #a h2 { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#4f46e5; font-weight:700; margin:0 0 8px; }
  #a .card { background:#f5f5fb; border-radius:14px; padding:12px 14px; margin-bottom:11px; }
  #a .job { margin-bottom:12px; }
  #a .job h3 { font-size:14px; }
  #a .proj { font-weight:700; font-size:12.5px; margin:7px 0 1px; }
  #a .tech { margin:2px 0 4px; }
  #a .tag { background:#ece9ff; color:#4338ca; }
  #a .muted { color:var(--muted); }
  #a .side h2 { margin-top:2px; }

  /* B: Timeline */
  #b { background:#fbf9f5; padding:15mm 15mm; }
  #b h1 { font-size:40px; font-weight:800; letter-spacing:-.03em; line-height:1; }
  #b h1 span { color:#059669; }
  #b .role { font-size:15px; color:#059669; font-weight:600; margin-top:6px; }
  #b .contact { margin-top:8px; font-size:11.5px; color:var(--muted); }
  #b .contact a, #b .contact span { margin-right:12px; }
  #b .lead { margin:12px 0 4px; font-size:13.5px; max-width:150mm; }
  #b h2 { font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:#059669; margin:16px 0 10px; font-weight:700; }
  #b .tl { position:relative; margin-left:6px; padding-left:20px; border-left:2px solid #d7e9e1; }
  #b .job { position:relative; margin-bottom:14px; }
  #b .job::before { content:""; position:absolute; left:-27px; top:4px; width:12px; height:12px; border-radius:50%; background:#fbf9f5; border:3px solid #059669; }
  #b .job h3 { font-size:14.5px; }
  #b .date { font-size:11.5px; font-weight:600; color:#059669; }
  #b .sub { color:var(--muted); }
  #b .proj { font-weight:700; margin:7px 0 1px; }
  #b .tech { margin:3px 0 4px; }
  #b .tag { background:#e1f3ec; color:#047857; }
  #b .two { display:grid; grid-template-columns:1fr 1fr; gap:12mm; }
  #b .muted { color:var(--muted); }

  /* C: Dev dark */
  #c { background:#0d1117; color:#d6dde6; padding:14mm 14mm; font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:12px; }
  #c .muted { color:#8793a3; }
  #c h1 { font-size:30px; color:#fff; font-weight:700; letter-spacing:-.02em; }
  #c h1::before { content:"> "; color:#3fb950; }
  #c .role { color:#3fb950; margin-top:4px; font-size:13px; }
  #c .contact { margin-top:8px; color:#8793a3; font-size:11px; }
  #c h2 { color:#79c0ff; font-size:12px; margin:16px 0 8px; font-weight:600; }
  #c h2::before { content:"// "; color:#8793a3; }
  #c .job { margin-bottom:12px; padding:10px 12px; border:1px solid #222b38; border-radius:10px; background:#111823; }
  #c .job h3 { color:#fff; font-size:13px; }
  #c .date { color:#d2a8ff; font-size:11px; }
  #c .sub { color:#8793a3; }
  #c .proj { color:#ffa657; margin:8px 0 1px; font-weight:600; }
  #c .tech { margin:3px 0 4px; }
  #c .tag { background:#1b2a3d; color:#79c0ff; border:1px solid #27405e; border-radius:6px; }
  #c li::marker { color:#3fb950; }
  #c .grid { display:grid; grid-template-columns:1fr 1fr; gap:10mm; }

  @media print {
    @page { size:A4; margin:0; }
    body { background:#fff; }
    .bar { display:none; }
    .stage { padding:0; display:block; }
    .page { box-shadow:none; }
    .page:not(.show) { display:none !important; }
  }
</style>
</head>
<body>
<div class="bar">
  <b>Resume templates</b>
  <button data-t="a" class="on">A · Aurora</button>
  <button data-t="b">B · Timeline</button>
  <button data-t="c">C · Dev dark</button>
  <button class="print" onclick="window.print()">Print / Save PDF</button>
</div>
<div class="stage">
  <div class="page show" id="a"></div>
  <div class="page" id="b"></div>
  <div class="page" id="c"></div>
</div>
<script>
const D = {
  name:"Rizwan Bin Mat Nawi", first:"Rizwan", last:"Bin Mat Nawi", role:"Mobile Developer (Android & iOS)",
  contact:["Selangor, MY","+60 11 1193 1511","rizwanmatnawi00@gmail.com","linkedin.com/in/rizwanmatnawi","github.com/RizwanATC"],
  summary:"Mobile developer with 5+ years of experience building responsive native Android and iOS apps. Proficient in Kotlin, Swift, Flutter and Next.js, with a focus on user experience, accessibility, performance and API integration. Strong problem-solver with attention to detail, experienced in Agile teams from concept to release.",
  jobs:[
    {co:"Riverlens Sdn. Bhd.", title:"Mobile Developer (Android & iOS)", date:"Jan 2025 – Present", projects:[
      {n:"Ommri Care — Patient App for Multi-Branch Clinic Group (Native iOS & Android)", t:"Swift 6, SwiftUI, Kotlin, Jetpack Compose, Hilt, Retrofit, Firebase, Stripe, ML Kit, ONNX Runtime", b:[
        "Built and maintained native iOS and Android apps for booking, prescriptions, medical records, video consults and payments (EN/BM), with feature parity via a shared design system.",
        "Implemented biometric sign-in with per-device P-256 keys (Secure Enclave, Android Keystore/StrongBox) and signed server challenges; added email verification, app lock, encrypted storage and session revocation.",
        "Integrated on-device eKYC (MyKad OCR with ML Kit, face matching with ONNX Runtime), Stripe/GrabPay, FCM deep links, iOS Live Activities and widgets.",
        "Improved accessibility (VoiceOver/TalkBack, Dynamic Type, dark mode) and gated unfinished features with server-driven flags.",
        "Wrote unit/UI tests (XCTest, Robolectric, Compose, MockWebServer) and CI scripts; shipped via TestFlight, Firebase App Distribution, Google Play and Huawei AppGallery.",
        "Reviewed API contracts with backend (TypeScript) and QA, and verified releases on real devices against staging."]},
      {n:"Alafasy — Main App (Native Android)", t:"Kotlin, MVVM, Jetpack, Coroutines/Flow/LiveData, Retrofit, Room, Hilt", b:[
        "Developed Android applications from scratch using Kotlin, including the Alafasy app, covering full SDLC from UI/UX implementation to production deployment.",
        "Implemented MVVM architecture using Jetpack components, ensuring clean separation of concerns and highly maintainable, scalable application structure.",
        "Utilized Coroutines and Kotlin Flow/LiveData for efficient asynchronous programming and reactive data handling across UI and data layers.",
        "Integrated RESTful APIs using Retrofit, handling JSON parsing, error handling, authentication flows, and secure network communication.",
        "Implemented Room database for local data persistence, enabling offline support and optimized data caching strategies.",
        "Applied Hilt (Dependency Injection) to improve modularity, testability, and scalability of the application architecture.",
        "Optimized application performance with focus on battery efficiency, memory management, background processing, and reduced network overhead."]}]},
    {co:"Noor Luminous Sdn. Bhd.", title:"Native Android Developer", date:"Jun 2023 – Dec 2024", b:[
      "Delivered features and maintained TheNoor apps, including automotive apps for Proton and Huawei Car focused on driver safety.",
      "Migrated Java to Kotlin (null safety, coroutines, extension functions), moved from web-based to native architecture and updated outdated libraries.",
      "Resolved bugs and acted on user feedback to improve performance and stability."]},
    {co:"Duogo Sdn. Bhd.", title:"Native Android Developer", date:"Jan 2022 – Jul 2022", b:[
      "Built discount features and new cashier opening/closing flows for desktop and mobile apps.",
      "Configured printer layouts and item calculation (tax, service charge), and integrated new feature APIs."]},
    {co:"ATX Sdn. Bhd.", title:"Native Android Developer", date:"Feb 2016 – Feb 2018", b:[
      "Led MY PAY STATION (redesign, backend alignment, API configuration) and Park & Pay (Android app, UI flow, RESTful APIs)."]},
    {co:"Meta (Facebook)", title:"Content Creator", date:"Mar 2018 – Dec 2021", b:[
      "Produced daily gaming streams and built a 105K-follower audience; edited video content, growing reach by 10%."]}
  ],
  edu:{deg:"Diploma in Computer Networking", sch:"Kolej Profesional MARA Indera Mahkota", note:"CGPA 3.2"},
  skills:["Kotlin","Swift / SwiftUI","Jetpack Compose","Flutter / Dart","Java","Next.js / JavaScript","MVVM","Hilt","Coroutines / Flow","Retrofit","Room","Firebase","REST APIs","XCTest / Robolectric"],
  soft:["Problem solving","Adaptability","Attention to detail","Continuous learning","Communication"],
  langs:["Bahasa Malaysia","English"],
  extra:["KWSP Calculator (Flutter)","Spending Tracker (Flutter)","Putrajaya Mosque AR (Android)","To-Do-List (Next.js)","Unreal Engine Training (Aug 2024)"]
};
const li = a => "<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
const tags = t => t.split(", ").map(x=>`<span class="tag">${x}</span>`).join("");
const jobBody = j => j.projects
  ? j.projects.map(p=>`<div class="proj">${p.n}</div><div class="tech">${tags(p.t)}</div>${li(p.b)}`).join("")
  : li(j.b);
const jobs = (cls) => D.jobs.map(j=>`<div class="job"><div class="row"><h3>${j.co}</h3><span class="${cls||"muted"} date">${j.date}</span></div><div class="sub muted">${j.title}</div>${jobBody(j)}</div>`).join("");

document.getElementById("a").innerHTML = `
  <div class="hero"><h1>${D.name}</h1><div class="role">${D.role}</div>
    <div class="contact">${D.contact.map(c=>`<span>${c}</span>`).join("")}</div></div>
  <div class="body">
    <div><h2>Experience</h2>${jobs()}</div>
    <div class="side">
      <div class="card"><h2>Profile</h2><p>${D.summary}</p></div>
      <div class="card"><h2>Skills</h2>${D.skills.map(s=>`<span class="tag">${s}</span>`).join("")}</div>
      <div class="card"><h2>Education</h2><p><b>${D.edu.deg}</b></p><p class="muted">${D.edu.sch} · ${D.edu.note}</p></div>
      <div class="card"><h2>Projects</h2>${li(D.extra)}</div>
      <div class="card"><h2>Languages</h2><p>${D.langs.join(" · ")}</p></div>
    </div>
  </div>`;

document.getElementById("b").innerHTML = `
  <h1>${D.first} <span>${D.last}</span></h1>
  <div class="role">${D.role}</div>
  <div class="contact">${D.contact.map(c=>`<span>${c}</span>`).join("")}</div>
  <p class="lead">${D.summary}</p>
  <h2>Experience</h2><div class="tl">${jobs()}</div>
  <div class="two">
    <div><h2>Skills</h2>${D.skills.map(s=>`<span class="tag">${s}</span>`).join("")}
      <h2>Languages</h2><p>${D.langs.join(" · ")}</p></div>
    <div><h2>Education</h2><p><b>${D.edu.deg}</b></p><p class="muted">${D.edu.sch} · ${D.edu.note}</p>
      <h2>Projects &amp; training</h2>${li(D.extra)}</div>
  </div>`;

document.getElementById("c").innerHTML = `
  <h1>${D.name}</h1><div class="role">${D.role}</div>
  <div class="contact">${D.contact.join("  |  ")}</div>
  <h2>profile</h2><p>${D.summary}</p>
  <h2>experience</h2>${jobs()}
  <div class="grid">
    <div><h2>skills</h2>${D.skills.map(s=>`<span class="tag">${s}</span>`).join("")}
      <h2>languages</h2><p>${D.langs.join(" · ")}</p></div>
    <div><h2>education</h2><p style="color:#fff">${D.edu.deg}</p><p class="muted">${D.edu.sch} · ${D.edu.note}</p>
      <h2>projects</h2>${li(D.extra)}</div>
  </div>`;

const btns=[...document.querySelectorAll(".bar button[data-t]")];
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("show",p.id===id));
  btns.forEach(b=>b.classList.toggle("on",b.dataset.t===id));
  try{localStorage.setItem("tpl2",id)}catch(e){}
}
btns.forEach(b=>b.onclick=()=>show(b.dataset.t));
try{const s=localStorage.getItem("tpl2"); if(s) show(s);}catch(e){}
</script>
</body>
</html>
