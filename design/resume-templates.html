<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Templates</title>
<style>
  :root { --bg:#e9e7e2; --ink:#1b1f24; --muted:#5b6470; --line:#d8d6d0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .bar { position:sticky; top:0; z-index:5; display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:10px 16px; background:#1b1f24; color:#fff; }
  .bar b { margin-right:8px; }
  .bar button { border:0; border-radius:8px; padding:7px 14px; font:inherit; cursor:pointer; background:#39414b; color:#fff; }
  .bar button.on { background:#f2b34c; color:#1b1f24; font-weight:600; }
  .bar .print { margin-left:auto; background:#fff; color:#1b1f24; }
  .stage { padding:24px 12px 60px; display:flex; justify-content:center; overflow-x:auto; }
  .page { width:210mm; min-height:297mm; background:#fff; box-shadow:0 6px 30px rgba(0,0,0,.18); flex:none; display:none; }
  .page.show { display:block; }
  .page h1,.page h2,.page h3,.page p,.page ul { margin:0; }
  .page ul { padding-left:16px; }
  .page li { margin:2px 0; }
  .muted { color:var(--muted); }
  .row { display:flex; justify-content:space-between; gap:12px; }
  .job { margin-bottom:11px; }
  .job h3 { font-size:13.5px; }
  .job .sub { font-size:12.5px; }
  .proj { font-weight:600; margin:6px 0 2px; font-size:12.5px; }
  .tech { font-size:11.5px; font-style:italic; color:var(--muted); margin-bottom:2px; }

  /* 1 Classic */
  #t1 { padding:16mm 16mm; font-family:Georgia,"Times New Roman",serif; font-size:12.5px; }
  #t1 .head { text-align:center; border-bottom:2px solid #1b1f24; padding-bottom:8px; margin-bottom:10px; }
  #t1 h1 { font-size:27px; letter-spacing:.06em; text-transform:uppercase; }
  #t1 .role { font-size:13px; letter-spacing:.12em; text-transform:uppercase; margin-top:2px; }
  #t1 .contact { font-size:11.5px; margin-top:4px; }
  #t1 h2 { font-size:12.5px; letter-spacing:.14em; text-transform:uppercase; border-bottom:1px solid var(--line); padding-bottom:2px; margin:12px 0 6px; }

  /* 2 Sidebar */
  #t2 { display:none; font-size:12.5px; }
  #t2.show { display:grid; grid-template-columns:68mm 1fr; }
  #t2 aside { background:#16324a; color:#e8eef4; padding:16mm 8mm; }
  #t2 aside h2 { font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#f2b34c; margin:16px 0 6px; }
  #t2 aside .muted { color:#aebdca; }
  #t2 aside .avatar { width:22mm; height:22mm; border-radius:50%; background:#f2b34c; color:#16324a; font:700 26px/22mm system-ui; text-align:center; margin-bottom:10px; }
  #t2 aside h1 { font-size:21px; line-height:1.15; }
  #t2 aside ul { list-style:none; padding:0; }
  #t2 aside li { margin:3px 0; }
  #t2 aside .chip { display:inline-block; border:1px solid #3d6283; border-radius:99px; padding:1px 8px; margin:2px 2px 0 0; font-size:11px; }
  #t2 main { padding:16mm 12mm 16mm 10mm; }
  #t2 main h2 { font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#16324a; margin:0 0 6px; padding-bottom:3px; border-bottom:2px solid #f2b34c; }
  #t2 main section { margin-bottom:14px; }

  /* 3 Minimal */
  #t3 { padding:18mm 18mm; font-size:12.5px; }
  #t3 h1 { font-size:34px; font-weight:300; letter-spacing:-.01em; }
  #t3 h1 b { font-weight:700; }
  #t3 .role { color:#0e8a7d; font-weight:600; margin-top:2px; }
  #t3 .contact { color:var(--muted); font-size:11.5px; margin:6px 0 14px; }
  #t3 .sec { display:grid; grid-template-columns:30mm 1fr; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  #t3 .sec > h2 { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#0e8a7d; padding-top:2px; }

  @media (max-width:820px){ .page{ transform-origin:top left; } }
  @media print {
    @page { size:A4; margin:0; }
    body { background:#fff; }
    .bar { display:none; }
    .stage { padding:0; display:block; }
    .page { box-shadow:none; }
    .page:not(.show) { display:none !important; }
  }
</style>
</head>
<body>
<div class="bar">
  <b>Resume templates</b>
  <button data-t="t1" class="on">1 · Classic</button>
  <button data-t="t2">2 · Sidebar</button>
  <button data-t="t3">3 · Minimal</button>
  <button class="print" onclick="window.print()">Print / Save PDF</button>
</div>
<div class="stage">
  <div class="page show" id="t1"></div>
  <div class="page" id="t2"></div>
  <div class="page" id="t3"></div>
</div>

<script>
const D = {
  name:"Rizwan Bin Mat Nawi", first:"Rizwan", last:"Bin Mat Nawi", role:"Mobile Developer (Android & iOS)",
  contact:["Selangor, MY","+60 11 1193 1511","rizwanmatnawi00@gmail.com","linkedin.com/in/rizwanmatnawi","github.com/RizwanATC"],
  summary:"Mobile developer with 5+ years of experience building responsive native Android and iOS apps. Proficient in Kotlin, Swift, Flutter and Next.js, with a focus on user experience, accessibility, performance and API integration. Strong problem-solver with attention to detail, experienced in Agile teams from concept to release.",
  jobs:[
    {co:"Riverlens Sdn. Bhd.", title:"Mobile Developer (Android & iOS)", date:"Jan 2025 – Present", projects:[
      {n:"Ommri Care — Patient App for Multi-Branch Clinic Group (Native iOS & Android)", t:"Swift 6, SwiftUI, Kotlin, Jetpack Compose, Hilt, Retrofit, Firebase, Stripe, ML Kit, ONNX Runtime", b:[
        "Built and maintained native iOS and Android apps for booking, prescriptions, medical records, video consults and payments (EN/BM), with feature parity via a shared design system.",
        "Implemented biometric sign-in with per-device P-256 keys (Secure Enclave, Android Keystore/StrongBox) and signed server challenges; added email verification, app lock, encrypted storage and session revocation.",
        "Integrated on-device eKYC (MyKad OCR with ML Kit, face matching with ONNX Runtime), Stripe/GrabPay, FCM deep links, iOS Live Activities and widgets.",
        "Improved accessibility (VoiceOver/TalkBack, Dynamic Type, dark mode) and gated unfinished features with server-driven flags.",
        "Wrote unit/UI tests (XCTest, Robolectric, Compose, MockWebServer) and CI scripts; shipped via TestFlight, Firebase App Distribution, Google Play and Huawei AppGallery.",
        "Reviewed API contracts with backend (TypeScript) and QA, and verified releases on real devices against staging."]},
      {n:"Alafasy — Main App (Native Android)", t:"Kotlin, MVVM, Jetpack, Coroutines/Flow/LiveData, Retrofit, Room, Hilt", b:[
        "Developed Android applications from scratch using Kotlin, including the Alafasy app, covering full SDLC from UI/UX implementation to production deployment.",
        "Implemented MVVM architecture using Jetpack components, ensuring clean separation of concerns and highly maintainable, scalable application structure.",
        "Utilized Coroutines and Kotlin Flow/LiveData for efficient asynchronous programming and reactive data handling across UI and data layers.",
        "Integrated RESTful APIs using Retrofit, handling JSON parsing, error handling, authentication flows, and secure network communication.",
        "Implemented Room database for local data persistence, enabling offline support and optimized data caching strategies.",
        "Applied Hilt (Dependency Injection) to improve modularity, testability, and scalability of the application architecture.",
        "Optimized application performance with focus on battery efficiency, memory management, background processing, and reduced network overhead."]}]},
    {co:"Noor Luminous Sdn. Bhd.", title:"Native Android Developer", date:"Jun 2023 – Dec 2024", b:[
      "Delivered features and maintained TheNoor apps, including automotive apps for Proton and Huawei Car focused on driver safety.",
      "Migrated Java to Kotlin (null safety, coroutines, extension functions), moved from web-based to native architecture and updated outdated libraries.",
      "Resolved bugs and acted on user feedback to improve performance and stability."]},
    {co:"Duogo Sdn. Bhd.", title:"Native Android Developer", date:"Jan 2022 – Jul 2022", b:[
      "Built discount features and new cashier opening/closing flows for desktop and mobile apps.",
      "Configured printer layouts and item calculation (tax, service charge), and integrated new feature APIs."]},
    {co:"ATX Sdn. Bhd.", title:"Native Android Developer", date:"Feb 2016 – Feb 2018", b:[
      "Led MY PAY STATION (redesign, backend alignment, API configuration) and Park & Pay (Android app, UI flow, RESTful APIs)."]},
    {co:"Meta (Facebook)", title:"Content Creator", date:"Mar 2018 – Dec 2021", b:[
      "Produced daily gaming streams and built a 105K-follower audience; edited video content, growing reach by 10%."]}
  ],
  edu:{deg:"Diploma in Computer Networking", sch:"Kolej Profesional MARA Indera Mahkota", note:"CGPA 3.2"},
  skills:["Kotlin","Swift / SwiftUI","Jetpack Compose","Flutter / Dart","Java","Next.js / JavaScript","MVVM","Hilt","Coroutines / Flow","Retrofit","Room","Firebase","REST APIs","XCTest / Robolectric"],
  soft:["Problem solving","Adaptability","Attention to detail","Continuous learning","Communication"],
  langs:["Bahasa Malaysia","English"],
  extra:["KWSP Calculator (Flutter)","Spending Tracker (Flutter)","Putrajaya Mosque AR (Android)","To-Do-List (Next.js)","Unreal Engine Training (Aug 2024)"]
};
const li = a => "<ul>"+a.map(x=>"<li>"+x+"</li>").join("")+"</ul>";
const jobBody = j => j.projects
  ? j.projects.map(p=>`<div class="proj">${p.n}</div><div class="tech">${p.t}</div>${li(p.b)}`).join("")
  : li(j.b);
const jobs = (cls) => D.jobs.map(j=>`<div class="job"><div class="row"><h3>${j.co}</h3><span class="muted">${j.date}</span></div><div class="sub muted">${j.title}</div>${jobBody(j)}</div>`).join("");

document.getElementById("t1").innerHTML = `
  <div class="head"><h1>${D.name}</h1><div class="role">${D.role}</div><div class="contact">${D.contact.join(" · ")}</div></div>
  <h2>Summary</h2><p>${D.summary}</p>
  <h2>Experience</h2>${jobs()}
  <h2>Education</h2><div class="row"><span><b>${D.edu.deg}</b>, ${D.edu.sch}</span><span class="muted">${D.edu.note}</span></div>
  <h2>Skills</h2><p>${D.skills.join(" · ")}</p>
  <h2>Projects &amp; Training</h2><p>${D.extra.join(" · ")}</p>
  <h2>Languages</h2><p>${D.langs.join(" · ")}</p>`;

document.getElementById("t2").innerHTML = `
  <aside>
    <div class="avatar">R</div>
    <h1>${D.first}<br>${D.last}</h1>
    <div class="muted" style="margin-top:4px">${D.role}</div>
    <h2>Contact</h2><ul>${D.contact.map(c=>`<li>${c}</li>`).join("")}</ul>
    <h2>Skills</h2>${D.skills.map(s=>`<span class="chip">${s}</span>`).join("")}
    <h2>Education</h2><p><b>${D.edu.deg}</b></p><p class="muted">${D.edu.sch}<br>${D.edu.note}</p>
    <h2>Languages</h2><ul>${D.langs.map(l=>`<li>${l}</li>`).join("")}</ul>
    <h2>Soft skills</h2><ul>${D.soft.map(l=>`<li>${l}</li>`).join("")}</ul>
  </aside>
  <main>
    <section><h2>Profile</h2><p>${D.summary}</p></section>
    <section><h2>Experience</h2>${jobs()}</section>
    <section><h2>Projects &amp; Training</h2>${li(D.extra)}</section>
  </main>`;

document.getElementById("t3").innerHTML = `
  <h1>${D.first} <b>${D.last}</b></h1>
  <div class="role">${D.role}</div>
  <div class="contact">${D.contact.join("  ·  ")}</div>
  <div class="sec"><h2>Profile</h2><p>${D.summary}</p></div>
  <div class="sec"><h2>Experience</h2><div>${jobs()}</div></div>
  <div class="sec"><h2>Skills</h2><p>${D.skills.join(", ")}</p></div>
  <div class="sec"><h2>Education</h2><p><b>${D.edu.deg}</b> — ${D.edu.sch} · ${D.edu.note}</p></div>
  <div class="sec"><h2>Other</h2><p>${D.extra.join(" · ")}<br><span class="muted">Languages: ${D.langs.join(", ")}</span></p></div>`;

const btns=[...document.querySelectorAll(".bar button[data-t]")];
function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("show",p.id===id));
  btns.forEach(b=>b.classList.toggle("on",b.dataset.t===id));
  try{localStorage.setItem("tpl",id)}catch(e){}
}
btns.forEach(b=>b.onclick=()=>show(b.dataset.t));
try{const s=localStorage.getItem("tpl"); if(s) show(s);}catch(e){}
</script>
</body>
</html>
